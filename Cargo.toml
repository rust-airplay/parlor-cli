[package]
name = "parlor-cli"
description = "parlor: an AirPlay receiver on the command line"
repository = "https://github.com/rust-airplay/parlor-cli"
homepage = "https://github.com/rust-airplay/parlor-cli"
readme = "README.md"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "parlor"
path = "src/lib.rs"

[[bin]]
name = "parlor"
path = "src/main.rs"

[features]
default = []
# What a session plays through. Off by default so a machine with no GStreamer builds this
# program unchanged: --render null reads the media and plays nothing, and needs no backend
# at all.
gst = ["dep:rust-airplay-gstream"]

[dependencies]
# The core library and the playback backend, both published on crates.io.
rust-airplay = "0.3.1"
# The playback backend, only with the gst feature.
rust-airplay-gstream = { version = "0.3.1", optional = true }
getrandom = "0.2"
log = "0.4"
tokio = { version = "1.53.2", default-features = false, features = ["rt-multi-thread", "macros"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
