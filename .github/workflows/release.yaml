name: Release

# Run this from the Actions tab. `tag` is the git tag to create and `changelog` is the body
# of the release; use \n for a line break in the input box.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.2.0; a missing v is added
        required: true
        type: string
      changelog:
        description: Release notes; use \n for line breaks, or leave empty to use RELEASE_NOTES.md
        required: false
        type: string
      draft:
        description: Create the release as a draft
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-parlor
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: parlor-linux
            archive: dist/*.tar.gz
          - os: windows-latest
            artifact: parlor-windows
            archive: dist/*.zip
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Normalise the tag
        run: |
          tag="${{ inputs.tag }}"
          echo "TAG=v${tag#[vV]}" >> "$GITHUB_ENV"

      - name: Install GStreamer (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install GStreamer (Windows)
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc

      # MSYS2's GStreamer is a MinGW build, so the Windows binary is built with the GNU
      # toolchain; the DLLs the GNU runtime needs travel beside it in the archive.
      - name: Prepare the GNU toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msys2 = '${{ steps.msys2.outputs.msys2-location }}'
          if (-not $msys2) { $msys2 = 'C:\msys64' }
          $prefix = Join-Path $msys2 'ucrt64'
          $pkgconf = Join-Path $prefix 'bin\pkgconf.exe'
          if (-not (Test-Path $pkgconf)) {
              $pkgconf = Join-Path $prefix 'bin\pkg-config.exe'
          }
          if (-not (Test-Path $pkgconf)) {
              throw "pkg-config was not installed under $prefix"
          }
          (Join-Path $prefix 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG=$pkgconf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$(Join-Path $prefix 'lib\pkgconfig')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      - name: Check pkg-config (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & $env:PKG_CONFIG --version
          & $env:PKG_CONFIG --cflags glib-2.0

      - name: Install Rust (Linux)
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu

      - name: Select the GNU toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "RUSTUP_TOOLCHAIN=stable-x86_64-pc-windows-gnu" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Run the tests
        run: cargo test --locked

      - name: Build the binary
        run: cargo build --release --locked --features gst

      - name: Package the release
        run: |
          set -euo pipefail
          tag="${TAG}"
          mkdir -p dist
          cp README.md LICENSE dist/
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp target/release/parlor dist/
            tar -czf "dist/parlor-${tag}-x86_64-unknown-linux-gnu.tar.gz" -C dist parlor README.md LICENSE
          else
            cp target/release/parlor.exe dist/
            files=(parlor.exe README.md LICENSE)
            # A GNU target links against its own runtime, and a machine with none of it
            # installed cannot start the program; the DLLs travel with the archive.
            msys2="${{ steps.msys2.outputs.msys2-location }}"
            if [ -z "${msys2:-}" ]; then
              msys2=/c/msys64
            fi
            for runtime in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
              if [ -f "${msys2}/ucrt64/bin/${runtime}" ]; then
                cp "${msys2}/ucrt64/bin/${runtime}" dist/
                files+=("${runtime}")
              fi
            done
            sevenzip="/c/Program Files/7-Zip/7z.exe"
            if [ ! -x "$sevenzip" ]; then
              sevenzip=7z
            fi
            (cd dist && "$sevenzip" a "parlor-${tag}-x86_64-pc-windows-gnu.zip" "${files[@]}")
          fi
          ls -l dist

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create the GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Normalise the tag
        run: |
          tag="${{ inputs.tag }}"
          echo "TAG=v${tag#[vV]}" >> "$GITHUB_ENV"

      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if [ "$TAG" != "v${version}" ]; then
            echo "Cargo.toml has ${version}, so the tag has to be v${version}; this run uses ${TAG}." >&2
            exit 1
          fi

      - name: Write the release notes
        env:
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          if [ -n "$CHANGELOG" ]; then
            printf '%b\n' "$CHANGELOG" > notes.md
          else
            cp RELEASE_NOTES.md notes.md
          fi
          printf '\n### Runtime\n\nThis build uses the GStreamer backend. The machine that runs it needs GStreamer 1.0 and its base plugins installed.\n' >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--title "parlor ${TAG}")
          if [ "${{ inputs.draft }}" = "true" ]; then
            args+=(--draft)
          fi
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --notes-file notes.md \
            "${args[@]}"
