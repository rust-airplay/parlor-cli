name: Release

# Run this from the Actions tab. `tag` is the git tag to create and `changelog` is the body
# of the release; use \n for a line break in the input box.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.2.0
        required: true
        type: string
      changelog:
        description: Release notes; use \n for line breaks
        required: true
        type: string
      draft:
        description: Create the release as a draft
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-parlor
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: parlor-linux
            archive: dist/*.tar.gz
          - os: windows-latest
            artifact: parlor-windows
            archive: dist/*.zip
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install GStreamer (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install GStreamer (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc

      # MSYS2's GStreamer is a MinGW build, so the Windows binary is built with the GNU
      # toolchain; the DLLs the GNU runtime needs travel beside it in the archive.
      - name: Prepare the GNU toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG=C:\msys64\ucrt64\bin\pkgconf.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=C:\msys64\ucrt64\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust (Linux)
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu

      - name: Select the GNU toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "RUSTUP_TOOLCHAIN=stable-x86_64-pc-windows-gnu" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Run the tests
        run: cargo test

      - name: Build the binary
        run: cargo build --release --features gst

      - name: Package the release
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          mkdir -p dist
          cp README.md LICENSE dist/
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp target/release/parlor dist/
            tar -czf "dist/parlor-${tag}-x86_64-unknown-linux-gnu.tar.gz" -C dist parlor README.md LICENSE
          else
            cp target/release/parlor.exe dist/
            files=(parlor.exe README.md LICENSE)
            for dll in libgcc_s_seh-1.dll libwinpthread-1.dll; do
              if [ -f "/c/msys64/ucrt64/bin/${dll}" ]; then
                cp "/c/msys64/ucrt64/bin/${dll}" dist/
                files+=("${dll}")
              fi
            done
            sevenzip="/c/Program Files/7-Zip/7z.exe"
            if [ ! -x "$sevenzip" ]; then
              sevenzip=7z
            fi
            (cd dist && "$sevenzip" a "parlor-${tag}-x86_64-pc-windows-gnu.zip" "${files[@]}")
          fi
          ls -l dist

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create the GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if [ "v${version}" != "${{ inputs.tag }}" ]; then
            echo "Cargo.toml has ${version}, but the tag is ${{ inputs.tag }}." >&2
            exit 1
          fi

      - name: Write the release notes
        env:
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          printf '%b\n' "$CHANGELOG" > notes.md
          printf '\n### Runtime\n\nThis build uses the GStreamer backend. The machine that runs it needs GStreamer 1.0 and its base plugins installed.\n' >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--title "parlor ${{ inputs.tag }}")
          if [ "${{ inputs.draft }}" = "true" ]; then
            args+=(--draft)
          fi
          gh release create "${{ inputs.tag }}" dist/* \
            --repo "${{ github.repository }}" \
            --notes-file notes.md \
            "${args[@]}"
